name: Build iOS App (Unsigned for Sideload)

on:
  push:
    branches: [ main ] # Sửa thành master nếu nhánh chính của bạn tên là master

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Giữ nguyên v22 vì Capacitor 6+ yêu cầu
          cache: 'npm'

      # Bước 1: Build ứng dụng React như bình thường
      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build

      # Bước 2: Xoá sạch thư mục ios cũ (nếu có) và ép máy Mac tự sinh lại từ đầu cho chuẩn
      - name: Fresh Add iOS Platform
        run: |
          rm -rf ios
          npx @capacitor/cli add ios

      # Bước 3: Đồng bộ code web vào dự án iOS vừa tạo
      - name: Sync with Capacitor
        run: npx @capacitor/cli sync ios

      # Bước 4: Ép Xcode dịch app dạng KHÔNG CẦN CHỮ KÝ (Tự động nhận diện Workspace hoặc Project)
      - name: Build iOS App (No Sign)
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            echo "Phát hiện file Workspace. Tiến hành build với xcworkspace..."
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO SYMROOT=$PWD/build clean build
          else
            echo "Không thấy Workspace. Tiến hành build trực tiếp với xcodeproj..."
            xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO SYMROOT=$PWD/build clean build
          fi

      # Bước 5: Đóng gói thủ công thành file .ipa sạch để mang về Windows tự ký
      - name: Package to Unsigned .ipa
        run: |
          mkdir -p Payload
          mv ios/App/build/Debug-iphoneos/App.app Payload/
          zip -r tracking-game.ipa Payload

      # Bước 6: Đẩy file .ipa lên mục Artifacts trên GitHub để tải về
      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: tracking-game.ipa