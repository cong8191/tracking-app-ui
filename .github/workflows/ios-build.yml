name: Build iOS App (Unsigned for Sideload)

on:
  push:
    branches: [ main ] # Sửa thành master nếu nhánh chính của bạn tên là master

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Bước 1: Build ứng dụng React như bình thường
      - name: Install dependencies and build web app
        run: |
          npm install
          npm run build

      # Bước 2: Gọi trực tiếp file thực thi chuẩn trong thư mục .bin để sync code
      - name: Sync with Capacitor
        run: ./node_modules/.bin/cap sync ios

      # Bước 3: Ép Xcode dịch app dạng KHÔNG CẦN CHỮ KÝ (Bypass Cert của Apple)
      - name: Build iOS App (No Sign)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO clean build

      # Bước 4: Đóng gói thủ công thành file .ipa sạch để mang về Windows tự ký
      - name: Package to Unsigned .ipa
        run: |
          mkdir -p Payload
          mv ios/App/build/Debug-iphoneos/App.app Payload/
          zip -r tracking-game.ipa Payload

      # Bước 5: Đẩy file .ipa lên mục Artifacts trên GitHub để tải về
      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: tracking-game.ipa